<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d4838" />
    <meta name="application-version" content="1.3c" />
    <title>Motorhome Compass</title>
    <script type="module" crossorigin src="/motorhome-buyer/assets/index-1.3b-live.js?v=1.3c"></script>
    <link rel="stylesheet" crossorigin href="/motorhome-buyer/assets/index-BDU57to4.css?v=1.3c">
    <style>
      .settings-backdrop{position:fixed;inset:0;z-index:1250;display:grid;place-items:center;padding:20px;background:#05100db8;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
      .settings-panel{position:relative;width:min(480px,100%);padding:26px;border-radius:22px;background:#fff;box-shadow:0 26px 80px #00000052;color:#17372e}
      .settings-panel h2{margin:0 46px 16px 0}
      .settings-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:50%;background:#edf3f0;color:#17372e;font-size:1.6rem;cursor:pointer}
      .settings-app-name{font-size:1.08rem;font-weight:900;margin-bottom:12px}
      .settings-version,.settings-detail{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-top:1px solid #dfeae6}
      .settings-version span,.settings-detail span{color:#60776f}
      .settings-version strong,.settings-detail strong{text-align:right;overflow-wrap:anywhere}
      .settings-note{margin:14px 0 0;color:#60776f;line-height:1.45;font-size:.92rem}
      .invite-reset{margin-top:10px!important}
      .settings-button{white-space:nowrap}
      .auth-or{text-align:center;margin:12px 0;font-weight:700;color:#65736d}
      .auth-submit.secondary{width:100%}
      .mhc-code-login{margin-top:18px;padding-top:18px;border-top:1px solid #dfe8e4;text-align:left}
      .mhc-code-login strong{display:block;margin-bottom:6px;color:#29483e}
      .mhc-code-login p{margin:0 0 12px;color:#65736d;line-height:1.45;font-size:.92rem}
      .mhc-code-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
      .mhc-code-row input{min-width:0;font-size:1.25rem;letter-spacing:.20em;text-align:center}
      .mhc-code-row button{white-space:nowrap}
      .mhc-code-status{min-height:1.25em;margin-top:10px!important;color:#315e4d!important;font-weight:700}
      @media(max-width:740px){
        .settings-backdrop{align-items:start;padding:calc(18px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto}
        .settings-panel{padding:22px 18px}
        .settings-button{font-size:.76rem}
        .mhc-code-row{grid-template-columns:1fr}
        .mhc-code-row button{width:100%}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (() => {
        const SUPABASE_URL = 'https://zrehazhflnyqrnavuuyu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HG1lLIIsT4Ig7OjL_oxsPA_LWjE5LEV';
        const STORAGE_KEY = 'sb-zrehazhflnyqrnavuuyu-auth-token';

        function polishAuthCopy() {
          document.querySelectorAll('button').forEach((button) => {
            if (button.textContent.trim() === 'Email me a secure sign-in link') {
              button.textContent = 'Email me a sign-in code';
            }
          });
          document.querySelectorAll('.auth-help').forEach((help) => {
            help.textContent = 'Check your inbox for the Motorhome Compass sign-in code, then enter it below. No password is needed.';
          });
          const version = document.querySelector('.settings-version strong');
          if (version) version.textContent = '1.3c';
        }

        function mountCodeLogin() {
          polishAuthCopy();

          document.querySelectorAll('.auth-card').forEach((card) => {
            if (card.querySelector('.mhc-code-login')) return;

            const emailInput = card.querySelector('input[type="email"]');
            if (!emailInput) return;

            const box = document.createElement('div');
            box.className = 'mhc-code-login';

            const title = document.createElement('strong');
            title.textContent = 'Enter your email code';

            const help = document.createElement('p');
            help.textContent = 'Request a fresh code above, then enter the one-time code from the Motorhome Compass email here. The sign-in completes inside this Home Screen app so this device can remember you.';

            const row = document.createElement('div');
            row.className = 'mhc-code-row';

            const codeInput = document.createElement('input');
            codeInput.type = 'text';
            codeInput.inputMode = 'numeric';
            codeInput.autocomplete = 'one-time-code';
            codeInput.maxLength = 8;
            codeInput.placeholder = '000000';
            codeInput.setAttribute('aria-label', 'One-time sign-in code');
            codeInput.addEventListener('input', () => {
              codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 8);
            });

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'primary';
            button.textContent = 'Sign in with code';

            const status = document.createElement('p');
            status.className = 'mhc-code-status';
            status.setAttribute('role', 'status');
            status.setAttribute('aria-live', 'polite');

            async function verify() {
              const email = emailInput.value.trim().toLowerCase();
              const token = codeInput.value.trim();

              if (!/^\S+@\S+\.\S+$/.test(email)) {
                status.textContent = 'Enter the email address the code was sent to.';
                return;
              }
              if (!/^\d{6,8}$/.test(token)) {
                status.textContent = 'Enter the full sign-in code from the email.';
                return;
              }

              button.disabled = true;
              button.textContent = 'Signing in…';
              status.textContent = 'Checking your code…';

              try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`
                  },
                  body: JSON.stringify({ email, token, type: 'email' })
                });

                const payload = await response.json().catch(() => ({}));

                if (!response.ok) {
                  throw new Error(
                    payload.msg ||
                    payload.message ||
                    payload.error_description ||
                    'The code was not accepted. Request a fresh code and try again.'
                  );
                }

                if (!payload.access_token || !payload.refresh_token) {
                  throw new Error('No login session was returned. Request a fresh code and try again.');
                }

                if (!payload.expires_at && payload.expires_in) {
                  payload.expires_at = Math.round(Date.now() / 1000) + Number(payload.expires_in);
                }

                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                status.textContent = 'Signed in. Opening your shared shortlist…';
                window.location.reload();
              } catch (error) {
                status.textContent = error?.message || 'The code could not be checked.';
                button.disabled = false;
                button.textContent = 'Sign in with code';
              }
            }

            button.addEventListener('click', verify);
            codeInput.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') verify();
            });

            row.append(codeInput, button);
            box.append(title, help, row, status);
            card.appendChild(box);
          });
        }

        new MutationObserver(mountCodeLogin).observe(document.documentElement, {
          childList: true,
          subtree: true
        });

        window.addEventListener('DOMContentLoaded', mountCodeLogin);
        window.setTimeout(mountCodeLogin, 0);
      })();
    </script>
  </body>
</html>
